name: Bug report
description: Report a reproducible problem in SyncSaga
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a duplicate.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable set of steps.
      placeholder: |
        1. Open ...
        2. Sign in ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web
        - Installed PWA
        - Browser extension
        - API
        - Authentication
        - Realtime / Socket.IO
        - Database
        - Deployment
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Android Chrome, desktop Chrome, PWA, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, tokens, and personal information before posting.
