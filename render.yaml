services:
  - type: web
    name: syncsaga-api
    runtime: node
    plan: starter
    region: oregon
    rootDirectory: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REDIS_URL
        fromKeyValue: syncsaga-redis
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://syncsaga.vercel.app,https://syncsaga.onrender.com,https://syncsaga-sy3089682-gmailcoms-projects.vercel.app,http://localhost:3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: AI_GROQ_API_KEY
        sync: false
      - key: AI_GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: syncsaga-data
      mountPath: /data
      sizeGB: 1

  - type: keyvalue
    name: syncsaga-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys_lru
    persistenceMode: off
